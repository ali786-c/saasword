<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <!-- White gradient for dark background visibility -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e0e0" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e53935" />
      <stop offset="100%" stop-color="#ff5252" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 15)">
    <!-- Briefcase Body (White for footer) -->
    <rect x="10" y="25" width="50" height="35" rx="5" fill="url(#whiteGrad)" />
    <!-- Briefcase Handle (White for footer) -->
    <path d="M 25 25 V 15 C 25 10 30 10 35 10 h 0 C 40 10 45 10 45 15 V 25" fill="none" stroke="url(#whiteGrad)" stroke-width="5" stroke-linecap="round" />
    
    <!-- Upward Trend / Success Arrow (Red) -->
    <path d="M 5 45 L 35 15 L 65 15 L 45 35" fill="url(#redGrad)" opacity="0.9" />
    <polygon points="65,15 65,30 50,15" fill="url(#redGrad)" />
  </g>

  <!-- Typography -->
  <g transform="translate(90, 65)">
    <text x="0" y="0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" letter-spacing="-1">
      <tspan font-size="42" fill="#ffffff">Career</tspan><tspan font-size="42" fill="#e53935">InPak</tspan><tspan font-size="24" font-weight="600" fill="#b0bec5">.com</tspan>
    </text>
    <text x="5" y="20" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#b0bec5" letter-spacing="1.5">
      JOBS &amp; SCHOLARSHIPS PORTAL
    </text>
  </g>
</svg>
