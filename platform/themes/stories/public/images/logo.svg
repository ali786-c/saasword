<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <!-- Definitions for Gradients -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c355e" />
      <stop offset="100%" stop-color="#2a5298" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e53935" />
      <stop offset="100%" stop-color="#ff5252" />
    </linearGradient>
  </defs>

  <!-- Logo Icon: A blend of a Briefcase (Jobs) and an Upward Arrow/Graduation (Success/Scholarships) -->
  <g transform="translate(10, 15)">
    <!-- Briefcase Body (Dark Blue) -->
    <rect x="10" y="25" width="50" height="35" rx="5" fill="url(#blueGrad)" />
    <!-- Briefcase Handle (Dark Blue) -->
    <path d="M 25 25 V 15 C 25 10 30 10 35 10 h 0 C 40 10 45 10 45 15 V 25" fill="none" stroke="url(#blueGrad)" stroke-width="5" stroke-linecap="round" />
    
    <!-- Upward Trend / Success Arrow (Red) overlaying the briefcase -->
    <path d="M 5 45 L 35 15 L 65 15 L 45 35" fill="url(#redGrad)" opacity="0.9" />
    <polygon points="65,15 65,30 50,15" fill="url(#redGrad)" />
  </g>

  <!-- Typography: Brand Name -->
  <g transform="translate(90, 65)">
    <!-- Combined text using tspan to remove unwanted spaces -->
    <text x="0" y="0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" letter-spacing="-1">
      <tspan font-size="42" fill="#1c355e">Career</tspan><tspan font-size="42" fill="#e53935">InPak</tspan><tspan font-size="24" font-weight="600" fill="#7f8c8d">.com</tspan>
    </text>
    
    <!-- Tagline -->
    <text x="5" y="20" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#95a5a6" letter-spacing="1.5">
      JOBS &amp; SCHOLARSHIPS PORTAL
    </text>
  </g>
</svg>
